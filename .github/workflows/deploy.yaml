name: Deploy docs

on:
  push:
    branches: [main]
  # 支持在Actions页面手动触发一次，方便验证工作流
  workflow_dispatch:

# peaceiris/actions-gh-pages需要向gh-pages分支推送
permissions:
  contents: write

# 同一分支只保留最新一次运行，避免两次部署互相覆盖
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Build docs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install pnpm
        uses: pnpm/action-setup@v5
        with:
          version: 11

      - name: Setup Node
        uses: actions/setup-node@v6
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 必须显式构建文档站：根 build 现在只构建发布包（@taro-ui/vue）
      - name: Build docs
        run: pnpm run docs:build

      # if-no-files-found: error —— 产物缺失时在「上传」这一步就报错，
      # 而不是留下一个不存在的 artifact，让 deploy 报 "Artifact not found"
      - name: Upload docs
        uses: actions/upload-artifact@v5
        with:
          name: docs
          path: ./packages/docs/.vitepress/dist
          if-no-files-found: error

  deploy:
    name: Deploy to GitHub Pages
    runs-on: ubuntu-latest
    needs: build
    steps:
      - uses: actions/checkout@v5

      - name: Download docs
        uses: actions/download-artifact@v5
        with:
          name: docs
          path: ./dist

      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./dist
